# Plan (and optionally apply) one environment.
#  plan  job: GitHub environment plan-<env>  -> read-only Azure identity, any branch
#  apply job: GitHub environment <env>       -> write identity, main only, reviewers for prod
# The apply job applies exactly the plan file the plan job produced and published.
name: terraform-env

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      apply:
        type: boolean
        default: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: 1.15.1
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    environment: plan-${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ENV_DIR: ../envs/${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform init -backend-config="$ENV_DIR/backend.hcl"

      # -lock=false: the plan identity can only read state; applies hold the lock
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -lock=false -var-file="$ENV_DIR/terraform.tfvars" -out=tfplan -detailed-exitcode
          code=$?
          set -e
          [ "$code" -eq 1 ] && exit 1
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          terraform show -no-color tfplan >plan.txt

      - name: Summary
        run: |
          {
            echo "## ${{ inputs.environment }}: $(grep -E '^(Plan:|No changes)' plan.txt || echo 'see log')"
            echo '<details><summary>Plan</summary>'
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            const marker = `<!-- terraform-plan:${env} -->`;
            const plan = fs.readFileSync('infra/plan.txt', 'utf8');
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['see run log'])[0];
            const body = [
              marker,
              `### Terraform plan: \`${env}\``,
              `**${summary}**`,
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan.length > 60000 ? plan.slice(0, 60000) + '\n... truncated, see run summary' : plan,
              '```',
              '</details>',
              '',
              `[Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Upload plan
        if: inputs.apply && steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra/tfplan
          retention-days: 3

  apply:
    name: apply
    needs: plan
    if: inputs.apply && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-24.04
    # Approval gate: required reviewers + main-only branch policy live on this environment
    environment: ${{ inputs.environment }}
    concurrency:
      group: apply-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ENV_DIR: ../envs/${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra

      - name: Init
        run: terraform init -backend-config="$ENV_DIR/backend.hcl"

      # Terraform refuses a stale plan if state changed since it was made
      - name: Apply
        run: terraform apply tfplan
