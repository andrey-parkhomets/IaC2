# Pull request: validate + plan every environment, plans posted on the PR.
# Merge to main: plan+apply dev, then plan prod and wait for approval before applying it.
# Adding an environment: one more job calling terraform-env.yml (and bootstrap entry).
# Changes that can't affect infrastructure (docs, bootstrap, other workflows) skip plan/apply.
name: infra

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

# PRs: newer pushes cancel older runs. main: runs queue; GitHub keeps only the newest
# pending run, which is fine because it contains every earlier commit.
concurrency:
  group: infra-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      terraform: ${{ steps.diff.outputs.terraform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # manual runs, new branches or an unknown base: run everything
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch || -z $BASE || $BASE =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}"; then
            echo "terraform=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE...$GITHUB_SHA")
          echo "$changed"
          if grep -qE '^(infra|modules|envs)/|^\.github/workflows/(infra|terraform-env)\.yml$' <<<"$changed"; then
            echo "terraform=true" >>"$GITHUB_OUTPUT"
          else
            echo "terraform=false" >>"$GITHUB_OUTPUT"
          fi

  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.1
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff
      - name: validate
        run: |
          for dir in infra bootstrap; do
            terraform -chdir=$dir init -backend=false -input=false >/dev/null
            terraform -chdir=$dir validate
          done

  dev:
    needs: [changes, validate]
    uses: ./.github/workflows/terraform-env.yml
    with:
      environment: dev
      apply: ${{ github.event_name != 'pull_request' }}
      run: ${{ needs.changes.outputs.terraform == 'true' }}

  prod:
    needs: [changes, dev]
    # also when dev's jobs were skipped, so "prod / plan" always reports for required checks
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/terraform-env.yml
    with:
      environment: prod
      apply: ${{ github.event_name != 'pull_request' }}
      run: ${{ needs.changes.outputs.terraform == 'true' }}
