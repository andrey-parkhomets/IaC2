version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot bumps SHA + version comment together
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories:
      - /infra
      - /bootstrap
      - /modules/*
    schedule:
      interval: weekly
    # Major provider upgrades are planned work (work plan #16), not weekly bumps
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
