version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot bumps SHA + version comment together
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories:
      - /infra
      - /bootstrap
      - /modules/*
    schedule:
      interval: weekly
    # Major provider upgrades are planned work (work plan #16), not weekly bumps
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # constraint bumps (~> 4.x -> ~> 5.x) aren't classified as semver-major, so pin explicitly
      - dependency-name: "hashicorp/azurerm"
        versions: [">= 5.0.0"]
      - dependency-name: "hashicorp/azuread"
        versions: [">= 4.0.0"]
      - dependency-name: "integrations/github"
        versions: [">= 7.0.0"]
